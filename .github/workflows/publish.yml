name: Publish npm package

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm
        run: npm install --global npm@12.0.2

      - run: npm ci
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - name: Publish
        run: |
          set +e
          publish_output=$(npm publish --access public --provenance 2>&1)
          publish_status=$?
          set -e
          printf '%s\n' "$publish_output"

          if [ "$publish_status" -eq 0 ]; then
            echo "Published package version."
          elif printf '%s\n' "$publish_output" | grep -qE 'cannot publish over|previously published|EPUBLISHCONFLICT'; then
            echo "Package version is already published; skipping."
          else
            exit "$publish_status"
          fi
